<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Charter — SkyLux</title>
</head>
<body>
    <div class="left-panel">
  <div class="left-bg"></div>
  <div class="left-content">
    <a href="index.html" class="logo">Sky<span>Lux</span></a>
    <p class="panel-quote">"Your time is the most precious currency. We guard it with ours."</p>
    <p class="panel-caption">✦ Private Aviation Excellence ✦</p>
  </div>
</div>

<!-- RIGHT PANEL -->
<div class="right-panel">
  <a href="index.html" class="mobile-logo">Sky<span>Lux</span></a>

  <p class="form-eyebrow">Welcome Back</p>
  <h1 class="form-title">Sign In</h1>
  <p class="form-sub">Access your SkyLux account to manage bookings and preferences.</p>

  <form onsubmit="handleLogin(event)">
    <div class="input-group">
      <label class="input-label">Email Address</label>
      <input type="email" class="input-field" placeholder="your@email.com" required>
    </div>

    <div class="input-group">
      <label class="input-label">Password</label>
      <input type="password" class="input-field" placeholder="••••••••" required>
    </div>

    <div class="form-options">
      <label class="checkbox-label">
        <input type="checkbox">
        <span class="checkbox-custom"></span>
        <span class="checkbox-text">Remember me</span>
      </label>
      <a href="#" class="forgot-link">Forgot password?</a>
    </div>

    <button type="submit" class="btn-submit">Sign In to SkyLux</button>
  </form>

  <div class="divider">or continue with</div>

  <div class="social-btns">
    <button class="social-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Google
    </button>
    <button class="social-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M17 2H7C4.24 2 2 4.24 2 7v10c0 2.76 2.24 5 5 5h10c2.76 0 5-2.24 5-5V7c0-2.76-2.24-5-5-5zm3 15c0 1.66-1.34 3-3 3H7c-1.66 0-3-1.34-3-3V7c0-1.66 1.34-3 3-3h10c1.66 0 3 1.34 3 3v10zM12 7a5 5 0 100 10A5 5 0 0012 7zm0 8a3 3 0 110-6 3 3 0 010 6zm4.5-9a1 1 0 100 2 1 1 0 000-2z"/>
      </svg>
      Apple
    </button>
  </div>

  <div class="form-footer">
    Don't have an account? <a href="signup.html">Create one →</a>
  </div>
</div>
</body>
</html>
